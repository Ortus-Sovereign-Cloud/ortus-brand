<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approve sign-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 6px; padding: 14px 8px">
    <a href="MobileScanQR.dc.html" aria-label="Back to scanner" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEEF3"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span style="flex: 1; font: 500 12px 'Geist Mono', monospace; color: #9198A8">SIGN-IN REQUEST · EXPIRES IN 38 s</span>
  </header>

  <div style="padding: 4px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2">Sign in to workstation WS-0417?</h1>
      <span style="color: #9198A8">As <strong style="color: #ECEEF3">you@ministry.example</strong></span>
    </div>

    <div style="padding: 14px; border-radius: 18px; background: #11131A; border: 1px solid #1E2129; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px"><span style="color: #9198A8">{{f.k}}</span><span style="font-weight: 500; text-align: right">{{f.v}}</span></div>
      </sc-for>
      <span style="font-size: 12px; color: #6FE0D5">Managed device · same building as your phone</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-weight: 600">Tap the number shown on the workstation</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{nums}}" as="n" hint-placeholder-count="3"><button style="{{n.style}}">{{n.v}}</button></sc-for>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; padding: 16px 20px 26px; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 56px; border-radius: 18px; border: 0; background: {{accent}}; color: #0A0B10; font: 600 16px Geist, sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2M9 10v1M15 10v1M10 15c1 .7 3 .7 4 0"/></svg>Approve with Face ID</button>
    <button style="height: 50px; border-radius: 16px; border: 1px solid rgba(255,122,110,.45); background: transparent; color: #FF9A92; font: 500 15px Geist, sans-serif">Deny — this wasn’t me</button>
    <span style="font-size: 12px; color: #9198A8; text-align: center">Denying locks the request and alerts security.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8EA2FF';
    const facts = [
      { k: 'Device', v: 'WS-0417 · Linux workstation' },
      { k: 'Place', v: '3rd floor, [Building]' },
      { k: 'Network', v: 'GOV-LAN' },
      { k: 'Time', v: '09:02 today' }
    ];
    const nums = ['27', '83', '46'].map((v) => ({
      v, style: 'height: 72px; border-radius: 18px; font: 600 26px Geist Mono, monospace; ' + (v === '83' ? 'border: 2px solid ' + accent + '; background: rgba(142,162,255,.12); color: #ECEEF3' : 'border: 1px solid #333846; background: #11131A; color: #ECEEF3')
    }));
    return { accent, facts, nums };
  }
}
</script>
</body>
</html>
