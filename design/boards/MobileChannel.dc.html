<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile channel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*//*dense2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 6px; padding: 12px 8px; border-bottom: 1px solid #1E2129">
    <a href="MobileChats.dc.html" aria-label="Back to chats" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEEF3"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600"># flood-response-2026</span><span style="font-size: 13px; color: #9198A8"><span style="font: 500 12px 'Geist Mono', monospace; color: #F5B57A">OFFICIAL-SENSITIVE</span> · 3 orgs · encrypted</span></span>
    <button aria-label="Join call" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: rgba(79,209,197,.15); color: #6FE0D5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg></button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="{{m.wrap}}">
        <sc-if value="{{m.who}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; color: #9198A8; padding: 0 4px">{{m.who}}</span></sc-if>
        <span style="{{m.bubble}}">{{m.text}}</span>
        <span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #8A91A1; padding: 0 4px">{{m.t}}</span>
      </div>
    </sc-for>
    <div style="align-self: stretch; padding: 16px; border-radius: 16px; background: #13151C; border: 1px solid #262A35; display: flex; flex-direction: column; gap: 12px">
      <span style="font-weight: 600">Open the second shelter at the school?</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <button style="height: 40px; border-radius: 12px; border: 0; background: {{accent}}; color: #0A0B10; font: 600 14px Geist, sans-serif">Yes · 18</button>
        <button style="height: 40px; border-radius: 12px; border: 1px solid #333846; background: transparent; color: #ECEEF3; font: 500 14px Geist, sans-serif">No · 3</button>
      </div>
      <span style="font-size: 13px; color: #9198A8">Closes 14:00 · goes to the decision log</span>
    </div>
  </div>

  <div style="padding: 10px 16px 22px; border-top: 1px solid #1E2129; display: flex; align-items: center; gap: 8px">
    <button aria-label="Attach" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #262A35; background: transparent; color: #C3C8D4; font: 400 22px Geist, sans-serif">+</button>
    <div style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 14px; border-radius: 16px; background: #13151C; border: 1px solid #333846">
      <label for="m" style="position: absolute; left: -9999px">Message</label>
      <input id="m" placeholder="Message" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #ECEEF3; font: 15px Geist, sans-serif">
      <button aria-label="Record voice message" style="width: 34px; height: 34px; border-radius: 11px; border: 0; background: {{accent}}; color: #0A0B10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8EA2FF';
    const raw = [
      { who: 'Anna · Regional', t: '10:41', text: 'Water level at the bridge gauge is 4.2 m and rising. Do we close the road now?' },
      { who: 'Marek', t: '10:44', text: 'Yes. Forecast says another 30 cm by noon.' },
      { who: '', t: '10:47', text: 'Agreed. Closing R-12 at 11:30, Marek owns comms.', me: true },
      { who: 'Jonas · Police', t: '10:58', text: 'Two units are on the way to R-12.' }
    ];
    const msgs = raw.map((m) => ({
      ...m,
      wrap: 'display: flex; flex-direction: column; gap: 4px; max-width: 82%; ' + (m.me ? 'align-self: flex-end; align-items: flex-end' : 'align-self: flex-start'),
      bubble: 'padding: 10px 14px; line-height: 1.45; border-radius: 18px; ' + (m.me ? 'background: ' + accent + '; color: #0A0B10; border-bottom-right-radius: 6px' : 'background: #161922; color: #ECEEF3; border-bottom-left-radius: 6px')
    }));
    return { accent, msgs };
  }
}
</script>
</body>
</html>
