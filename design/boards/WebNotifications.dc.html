<a href="WebPersonal.dc.html" aria-label="My settings" style="width: 36px; height: 36px; margin-top: 6px; border-radius: 12px; background: #DDE3F8; color: #0A0B10; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; ">OH</a>
</nav>
<div style="flex: 999 1 560px; min-width: 0">
<div style="position: relative; min-height: 900px; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #0D0E14 0 240px, #0A0B10 240px 241px); opacity: .6"></div>
  <header style="position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #1E2129">
        <span style="font-weight: 600">Ortus</span>
    <span style="flex: 1"></span>
    <button aria-label="Notifications, 9 unread" style="position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid {{accent}}; background: #1E2230; color: #ECEEF3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg><span style="position: absolute; right: -4px; top: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: #FF7A6E; color: #0A0B10; font: 700 12px Geist, sans-serif; display: flex; align-items: center; justify-content: center">9</span></button>
  </header>
  <section role="dialog" aria-labelledby="nc-h" style="position: absolute; right: 24px; top: 76px; width: calc(100% - 48px); max-width: 480px; border-radius: 22px; background: #11131A; border: 1px solid #2A2E3A; box-shadow: 0 30px 80px rgba(0,0,0,.6); display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 8px; padding: 20px 24px; border-bottom: 1px solid #1E2129">
      <h1 id="nc-h" style="margin: 0; flex: 1; font-size: 20px; font-weight: 600">Notifications</h1>
      <button style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #333846; background: transparent; color: #C3C8D4; font: 500 14px Geist, sans-serif">Settings</button>
    </div>
    <div style="display: flex; gap: 8px; padding: 16px 24px 12px; flex-wrap: wrap">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button style="{{t.style}}">{{t.l}}</button></sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 12px 12px">
      <sc-for list="{{items}}" as="n" hint-placeholder-count="7">
        <a href="{{n.href}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 12px; border-radius: 14px; text-decoration: none; color: #ECEEF3; {{n.bg}}">
          <span style="{{n.icon}}">{{n.k}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 500; line-height: 1.35">{{n.t}}</span><span style="font-size: 13px; color: #9198A8">{{n.m}}</span></span>
          <sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}"><span style="width: 8px; height: 8px; flex: none; margin-right: 4px; border-radius: 50%; background: {{accent}}"></span></sc-if>
        </a>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-top: 1px solid #1E2129; background: #0F1117">
      <span style="flex: 1; font-size: 14px; color: #C3C8D4">Quiet outside 08:00–17:00</span>
      <span style="width: 40px; height: 24px; border-radius: 12px; background: #333846; position: relative"><span style="position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #9198A8"></span></span>
      <span style="font-size: 13px; color: #9198A8">Do not disturb</span>
    </div>
  </section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8EA2FF';
    const tabs = ['All 9', 'Mentions 2', 'Approvals 2', 'Alerts 1'].map((l, i) => ({ l, style: 'height: 36px; padding: 0 14px; border-radius: 12px; font: 500 13px Geist, sans-serif; ' + (i === 0 ? 'border: 0; background: #ECEEF3; color: #0A0B10' : 'border: 1px solid #262A35; background: transparent; color: #C3C8D4') }));
    const K = { '!': ['rgba(255,122,110,.15)', '#FF9A92'], S: ['rgba(245,163,92,.15)', '#F5B57A'], '@': ['rgba(142,162,255,.15)', '#A9B6FF'], T: ['rgba(198,240,107,.14)', '#D4F28F'], C: ['rgba(79,209,197,.15)', '#6FE0D5'], D: ['#1E2230', '#C3C8D4'] };
    const raw = [
      ['!', 'Gauge at the bridge passed 4.2 m', 'Alert · now', 'WebChat.dc.html', true],
      ['S', 'Review: Flood response plan v12', 'Approval · due 14:00', 'WebApprovals.dc.html', true],
      ['@', 'Anna mentioned you in #flood-response', 'Chat · 2 min', 'WebChat.dc.html', true],
      ['T', 'Marek accepted “Close road R-12”', 'Tasks · 10 min', 'WebTasks.dc.html', true],
      ['D', 'Ana suggested an edit in Flood plan', 'Docs · 10 min', 'WebDocEditor.dc.html'],
      ['C', 'Room 3.12 booked for Shelter agreement review', 'Calendar · Thu 14:00', 'WebRooms.dc.html'],
      ['D', 'New record filed to case 2026/EM/0114', 'Records · 18 min', 'WebRecords.dc.html']
    ];
    const items = raw.map(([k, t, m, href, unread]) => ({ k, t, m, href, unread: !!unread, bg: unread ? 'background: #161922' : '', icon: 'width: 40px; height: 40px; flex: none; border-radius: 13px; display: flex; align-items: center; justify-content: center; font: 600 15px Geist, sans-serif; background: ' + K[k][0] + '; color: ' + K[k][1] }));
    return { accent, tabs, items };
  }
}
</script>
</body>
</html>
