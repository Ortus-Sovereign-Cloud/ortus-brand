<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*//*dense2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center"><h1 style="margin: 0; flex: 1; font-size: 30px; font-weight: 600; letter-spacing: -.03em">Activity</h1><button style="height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid #262A35; background: transparent; color: #C3C8D4; font: 500 13px Geist, sans-serif">Mark all read</button></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #13151C; border: 1px solid #262A35">
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 500">Focus until 12:00</span><span style="font-size: 13px; color: #9198A8">Only urgent alerts and your manager get through</span></span>
      <span style="width: 44px; height: 26px; border-radius: 13px; background: {{accent}}; position: relative"><span style="position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 50%; background: #0A0B10"></span></span>
    </div>
  </header>
  <div style="flex: 1; padding: 0 8px; display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{items}}" as="n" hint-placeholder-count="7">
      <a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; text-decoration: none; color: #ECEEF3; {{n.bg}}">
        <span style="{{n.icon}}">{{n.k}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 500; line-height: 1.35">{{n.t}}</span><span style="font-size: 13px; color: #9198A8">{{n.m}}</span></span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8EA2FF';
    const K = { URGENT: ['rgba(255,122,110,.15)', '#FF9A92'], SIGN: ['rgba(245,163,92,.15)', '#F5B57A'], CHAT: ['rgba(142,162,255,.15)', '#A9B6FF'], CAL: ['rgba(79,209,197,.15)', '#6FE0D5'], DOC: ['#1E2230', '#C3C8D4'], MAIL: ['#1E2230', '#C3C8D4'] };
    const raw = [
      ['URGENT', 'Gauge at bridge passed 4.2 m', 'Alert · Emergency channel · now', 'WebChat.dc.html', true],
      ['SIGN', 'Review: Flood response plan v12', 'Approvals · due today', 'MobileApprovals.dc.html', true],
      ['CHAT', 'Anna mentioned you in #flood-response', '2 min', 'MobileChannel.dc.html', true],
      ['CAL', 'Call: River Authority in 15 min', 'Calendar · Join video', 'MobileCalendar.dc.html'],
      ['DOC', 'Ana suggested an edit in Flood plan', 'Docs · 10 min', 'WebDocEditor.dc.html'],
      ['MAIL', '3 new in support@ assigned to you', 'Shared mailbox · 20 min', 'WebSharedMailbox.dc.html'],
      ['CHAT', 'New room live: Office hours', 'Volunteer Hub · 4 people', 'MobileRoom.dc.html']
    ];
    const items = raw.map(([k, t, m, href, unread]) => ({
      k: k.slice(0, 1), t, m, href,
      bg: unread ? 'background: #11131A' : '',
      icon: 'width: 40px; height: 40px; flex: none; border-radius: 13px; display: flex; align-items: center; justify-content: center; font: 600 13px Geist, sans-serif; font-variant-numeric: tabular-nums; background: ' + K[k][0] + '; color: ' + K[k][1]
    }));
    return { accent, items };
  }
}
</script>
</body>
</html>
