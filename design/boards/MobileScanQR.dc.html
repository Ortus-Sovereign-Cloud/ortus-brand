<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan to sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1A1D24; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(400px 300px at 50% 40%, #3A3F4C 0%, #15171D 70%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 95px; top: 250px; width: 200px; height: 200px; transform: rotate(-4deg); border-radius: 10px; background: #F2F3F5; padding: 12px; box-sizing: border-box; opacity: .9">
    <div style="width: 100%; height: 100%; background-image: repeating-linear-gradient(90deg, #0A0B10 0 7px, transparent 7px 14px), repeating-linear-gradient(0deg, #0A0B10 0 7px, transparent 7px 16px); opacity: .55"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(7,8,12,.55); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0, 75px 230px, 75px 470px, 315px 470px, 315px 230px, 75px 230px)"></div>
  <div aria-hidden="true" style="position: absolute; left: 75px; top: 230px; width: 240px; height: 240px">
    <span style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-left: 4px solid {{accent}}; border-top: 4px solid {{accent}}; border-radius: 14px 0 0 0"></span>
    <span style="position: absolute; right: 0; top: 0; width: 40px; height: 40px; border-right: 4px solid {{accent}}; border-top: 4px solid {{accent}}; border-radius: 0 14px 0 0"></span>
    <span style="position: absolute; left: 0; bottom: 0; width: 40px; height: 40px; border-left: 4px solid {{accent}}; border-bottom: 4px solid {{accent}}; border-radius: 0 0 0 14px"></span>
    <span style="position: absolute; right: 0; bottom: 0; width: 40px; height: 40px; border-right: 4px solid {{accent}}; border-bottom: 4px solid {{accent}}; border-radius: 0 0 14px 0"></span>
    <span style="position: absolute; left: 12px; right: 12px; top: 118px; height: 2px; background: {{accent}}; box-shadow: 0 0 16px {{accent}}"></span>
  </div>

  <header style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 14px 8px">
    <a href="MobileInbox.dc.html" aria-label="Close scanner" style="width: 44px; height: 44px; border-radius: 14px; background: rgba(7,8,12,.6); display: flex; align-items: center; justify-content: center; color: #ECEEF3; text-decoration: none; font-size: 20px">×</a>
    <span style="flex: 1; text-align: center; font-weight: 600">Scan to sign in</span>
    <button aria-label="Torch" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: rgba(7,8,12,.6); color: #ECEEF3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l-1 6H9ZM9 8h6v13H9Z"/></svg></button>
  </header>

  <div style="position: absolute; left: 0; right: 0; top: 500px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 32px; text-align: center">
    <span style="font-weight: 600; font-size: 17px">Point at the code on the workstation</span>
    <span style="font-size: 13px; color: #C3C8D4">Only codes from your organisation are accepted.</span>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; padding: 14px; border-radius: 20px; background: rgba(17,19,26,.92); border: 1px solid #2A2E3A; display: flex; flex-direction: column; gap: 10px">
    <span style="display: flex; align-items: center; gap: 10px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4FD1C5"></span><span style="flex: 1; font-size: 13px">This phone is enrolled and up to date</span><span style="font: 500 12px 'Geist Mono', monospace; color: #6FE0D5">OK</span></span>
    <span style="font-size: 12px; color: #9198A8">Never scan a sign-in code someone sends you in a message or email.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#8EA2FF' };
  }
}
</script>
</body>
</html>
