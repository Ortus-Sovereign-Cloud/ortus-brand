<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile approvals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*//*dense2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.03em">For you</h1>
    <div style="display: flex; gap: 6px">
      <button style="height: 36px; padding: 0 14px; border-radius: 12px; border: 0; background: #ECEEF3; color: #0A0B10; font: 600 13px Geist, sans-serif">Approvals 2</button>
      <a href="MobileTasks.dc.html" style="height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid #262A35; background: transparent; color: #C3C8D4; font: 500 13px Geist, sans-serif; display: inline-flex; align-items: center; text-decoration: none; box-sizing: border-box">Tasks 6</a>
      <button style="height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid #262A35; background: transparent; color: #C3C8D4; font: 500 13px Geist, sans-serif">Forms 1</button>
    </div>
  </header>
  <div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="padding: 16px; border-radius: 18px; background: #11131A; border: 1px solid #262A35; display: flex; flex-direction: column; gap: 12px">
      <span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #F5B57A">Sign · due today</span>
      <span style="font-weight: 600; font-size: 17px">Flood response plan 2026 · v12</span>
      <span style="font-size: 13px; color: #9198A8">From Marek · Olena approved 14:05 · you are step 3 of 3</span>
      <div style="display: flex; gap: 4px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #4FD1C5"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #4FD1C5"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <a href="WebApprovals.dc.html" style="height: 44px; border-radius: 12px; border: 1px solid #333846; color: #ECEEF3; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 500">Read document</a>
        <button style="height: 44px; border-radius: 12px; border: 0; background: {{accent}}; color: #0A0B10; font: 600 14px Geist, sans-serif">Sign with eID</button>
      </div>
    </div>
    <div style="padding: 16px; border-radius: 18px; background: #11131A; border: 1px solid #262A35; display: flex; flex-direction: column; gap: 12px">
      <span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8">Approve · purchase request</span>
      <span style="font-weight: 600; font-size: 17px">6 buses for evacuation · [AMOUNT]</span>
      <span style="font-size: 13px; color: #9198A8">From Olena · within budget line 4.2</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button style="height: 44px; border-radius: 12px; border: 1px solid #333846; background: transparent; color: #ECEEF3; font: 600 14px Geist, sans-serif">Approve</button>
        <button style="height: 44px; border-radius: 12px; border: 1px solid #333846; background: transparent; color: #ECEEF3; font: 500 14px Geist, sans-serif">Ask</button>
        <button style="height: 44px; border-radius: 12px; border: 1px solid rgba(255,122,110,.45); background: transparent; color: #FF9A92; font: 500 14px Geist, sans-serif">Reject</button>
      </div>
    </div>
    <span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8; padding-top: 6px">Tasks due today</span>
    <sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: #11131A">
        <input type="checkbox" style="width: 20px; height: 20px; accent-color: {{accent}}">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">{{t.t}}</span><span style="font-size: 13px; color: #9198A8">{{t.m}}</span></span>
      </label>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#8EA2FF',
      tasks: [
        { t: 'Close road R-12', m: 'Flood response · 2 of 4 steps' },
        { t: 'Update public info page', m: 'From chat · #flood-response' },
        { t: 'Open school shelter', m: 'Flood response · 3 of 5 steps' }
      ]
    };
  }
}
</script>
</body>
</html>
