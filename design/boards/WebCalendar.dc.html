<div style="flex: 999 1 560px; min-width: 0">
<div style="display: flex; flex-direction: column; min-height: 900px; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px">

  <header style="display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #1E2129; flex-wrap: wrap">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 200px">
            <div role="tablist" style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #13151C; border: 1px solid #262A35"><a href="WebCalendar.dc.html" role="tab" aria-selected="true" style="height: 34px; padding: 0 14px; border-radius: 9px; display: flex; align-items: center; text-decoration: none; background: #1E2230; color: #ECEEF3; font-weight: 600">Calendar</a><a href="WebAppointments.dc.html" role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border-radius: 9px; display: flex; align-items: center; text-decoration: none; color: #9198A8; font-weight: 500">Appointments</a><a href="WebRooms.dc.html" role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border-radius: 9px; display: flex; align-items: center; text-decoration: none; color: #9198A8; font-weight: 500">Rooms</a></div>
    </div>
    <span style="flex: 1"></span>
    <button aria-label="Previous week" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #262A35; background: transparent; color: #ECEEF3">‹</button>
    <button style="height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid #262A35; background: transparent; color: #ECEEF3; font: 500 14px Geist, sans-serif">Today</button>
    <button aria-label="Next week" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #262A35; background: transparent; color: #ECEEF3">›</button>
    <span style="font-weight: 600; font-size: 16px; min-width: 150px">16 – 20 Nov 2026</span>
    <div style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #13151C; border: 1px solid #262A35">
      <button style="height: 34px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #9198A8; font: 500 13px Geist, sans-serif">Day</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 9px; border: 0; background: #1E2230; color: #ECEEF3; font: 600 13px Geist, sans-serif">Week</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #9198A8; font: 500 13px Geist, sans-serif">Month</button>
    </div>
    <a href="WebSearch.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #262A35; color: #9198A8; text-decoration: none; font-size: 14px">Quick add <kbd style="font: 500 12px 'Geist Mono', monospace; color: #C3C8D4">Ctrl K</kbd></a>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap">
    <aside style="flex: 1 1 220px; max-width: 248px; padding: 20px 16px 20px 24px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">
      <button style="height: 44px; border-radius: 12px; border: 0; background: {{accent}}; color: #0A0B10; font: 600 15px Geist, sans-serif">New event</button>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-weight: 600">November</span>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; font-size: 13px; font-variant-numeric: tabular-nums; text-align: center">
          <sc-for list="{{month}}" as="d" hint-placeholder-count="35">
            <span style="{{d.style}}">{{d.n}}</span>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 500; color: #9198A8">Calendars</span>
        <sc-for list="{{cals}}" as="c" hint-placeholder-count="4">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 36px"><input type="checkbox" checked style="accent-color: {{c.color}}; width: 16px; height: 16px">{{c.name}}</label>
        </sc-for>
      </div>
    </aside>

    <main style="flex: 999 1 640px; min-width: 0; padding: 20px 24px 20px 0; box-sizing: border-box">
      <div style="border-radius: 20px; background: #11131A; border: 1px solid #1E2129; overflow-x: auto">
        <div style="min-width: 640px">
          <div style="display: flex; border-bottom: 1px solid #1E2129">
            <div style="width: 64px; flex: none"></div>
            <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
              <div style="flex: 1; padding: 14px 16px; display: flex; align-items: baseline; gap: 8px; border-left: 1px solid #1E2129">
                <span style="font-size: 13px; color: #9198A8">{{d.dow}}</span>
                <span style="{{d.numStyle}}">{{d.n}}</span>
              </div>
            </sc-for>
          </div>
          <div style="display: flex; position: relative">
            <div style="width: 64px; flex: none; display: flex; flex-direction: column">
              <sc-for list="{{hours}}" as="h" hint-placeholder-count="11">
                <span style="height: 64px; box-sizing: border-box; padding: 6px 10px 0 0; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: #8A91A1">{{h}}</span>
              </sc-for>
            </div>
            <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
              <div style="{{d.colStyle}}">
                <sc-for list="{{d.events}}" as="e" hint-placeholder-count="2">
                  <a href="#" style="{{e.style}}">
                    <span style="font-weight: 600; font-size: 13px; line-height: 1.3">{{e.title}}</span>
                    <span style="font-size: 13px; font-variant-numeric: tabular-nums; opacity: .8">{{e.time}}</span>
                  </a>
                </sc-for>
                <sc-if value="{{d.today}}" hint-placeholder-val="{{ false }}">
                  <div style="position: absolute; left: 0; right: 0; top: {{nowTop}}; height: 2px; background: #FF7A6E"><span style="position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #FF7A6E"></span></div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8EA2FF';
    const H = 64, start = 8;
    const kinds = {
      work: ['rgba(142,162,255,.18)', '#C9D1FF', accent],
      appt: ['rgba(79,209,197,.16)', '#8FECE3', '#4FD1C5'],
      focus: ['repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 6px, transparent 6px 12px)', '#C3C8D4', '#8A91A1'],
      ext: ['rgba(245,163,92,.16)', '#F8C79A', '#F5A35C']
    };
    const ev = (title, s, e, k, tentative) => {
      const [bg, fg, bar] = kinds[k];
      const fmt = (x) => String(Math.floor(x)).padStart(2, '0') + ':' + (x % 1 ? '30' : '00');
      return {
        title, time: e - s > 0.5 ? fmt(s) + '–' + fmt(e) : '',
        style: 'position: absolute; left: 4px; right: 4px; top: ' + ((s - start) * H + 2) + 'px; height: ' + ((e - s) * H - 4) + 'px; box-sizing: border-box; padding: 5px 12px; border-radius: 10px; background: ' + bg + '; color: ' + fg + '; box-shadow: inset 3px 0 0 ' + bar + (tentative ? '; outline: 1px dashed ' + bar : '') + '; text-decoration: none; display: flex; flex-direction: column; gap: 2px; overflow: hidden'
      };
    };
    const raw = [
      { dow: 'Mon', n: '16', events: [ev('Standup', 9.5, 10, 'work'), ev('Focus: bus plan', 10.5, 12.5, 'focus'), ev('Regional sync', 14, 15, 'ext')] },
      { dow: 'Tue', n: '17', events: [ev('Standup', 9.5, 10, 'work'), ev('Citizen advice · booked', 11, 11.5, 'appt'), ev('Plan review', 13, 14.5, 'work')] },
      { dow: 'Wed', n: '18', today: true, events: [ev('Standup', 9.5, 10, 'work'), ev('Call: River Authority', 11.5, 12, 'appt'), ev('Focus: bus plan', 15, 16, 'focus')] },
      { dow: 'Thu', n: '19', events: [ev('Standup', 9.5, 10, 'work'), ev('Citizen visit · booked', 10, 11, 'appt'), ev('Shelter review · legal', 14, 14.5, 'ext', true), ev('Hydrology briefing', 16, 16.5, 'ext', true)] },
      { dow: 'Fri', n: '20', events: [ev('Focus: shelter staffing', 9.5, 11.5, 'focus'), ev('Week review', 15.5, 17, 'work')] }
    ];
    const days = raw.map((d) => ({
      ...d, today: !!d.today,
      numStyle: 'font-size: 18px; font-weight: 600; ' + (d.today ? 'color: #0A0B10; background: ' + accent + '; border-radius: 8px; padding: 0 6px' : ''),
      colStyle: 'flex: 1; position: relative; height: ' + (11 * H) + 'px; border-left: 1px solid #1E2129; background-image: repeating-linear-gradient(to bottom, transparent 0 ' + (H - 1) + 'px, #1A1D25 ' + (H - 1) + 'px ' + H + 'px)' + (d.today ? ', linear-gradient(rgba(142,162,255,.04), rgba(142,162,255,.04))' : '')
    }));
    const hours = Array.from({ length: 11 }, (_, i) => String(start + i).padStart(2, '0') + ':00');
    const month = [];
    for (let i = 0; i < 6; i++) month.push({ n: '', style: '' });
    for (let n = 1; n <= 30; n++) {
      const wk = n >= 16 && n <= 20, today = n === 18;
      month.push({ n: String(n), style: 'height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 7px; ' + (today ? 'background: ' + accent + '; color: #0A0B10; font-weight: 600' : wk ? 'background: #1E2230; color: #ECEEF3' : 'color: #9198A8') });
    }
    return {
      accent, days, hours, month,
      nowTop: ((11.37 - start) * H) + 'px',
      cals: [{ name: 'Work', color: accent }, { name: 'Appointments', color: '#4FD1C5' }, { name: 'Regional office', color: '#F5A35C' }, { name: 'Focus time', color: '#8A91A1' }]
    };
  }
}
</script>
