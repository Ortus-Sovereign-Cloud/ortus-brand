<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*//*dense2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">

  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <h1 style="margin: 0; flex: 1; font-size: 30px; font-weight: 600; letter-spacing: -.03em">Inbox</h1>
      <a href="MobileSearch.dc.html" aria-label="Search" style="width: 44px; height: 44px; border-radius: 14px; background: #13151C; border: 1px solid #262A35; color: #ECEEF3; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
      <button aria-label="Account" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #333846; background: #1B1E27; color: #ECEEF3; font: 600 13px Geist, sans-serif">OH</button>
    </div>
    <a href="MobileCalendar.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #13151C; border: 1px solid #262A35; text-decoration: none; color: #ECEEF3">
      <span style="width: 4px; align-self: stretch; border-radius: 2px; background: #4FD1C5"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #6FE0D5">Next · in 22 min</span><span style="font-weight: 500">Call: River Authority · 11:30</span></span>
      <span style="height: 32px; padding: 0 12px; border-radius: 10px; background: #1E2230; display: flex; align-items: center; font-size: 13px; font-weight: 600">Join</span>
    </a>
    <div role="tablist" style="display: flex; gap: 6px">
      <button role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: 12px; border: 0; background: #ECEEF3; color: #0A0B10; font: 600 13px Geist, sans-serif">Important 4</button>
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid #262A35; background: transparent; color: #C3C8D4; font: 500 13px Geist, sans-serif">Other 8</button>
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid #262A35; background: transparent; color: #C3C8D4; font: 500 13px Geist, sans-serif">Feeds</button>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0 8px; gap: 4px">
    <div style="position: relative; border-radius: 16px; overflow: hidden; background: #F5A35C">
      <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #0A0B10; font-size: 13px; font-weight: 700">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/></svg>Snooze
      </div>
      <a href="MobileThread.dc.html" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 12px; text-decoration: none; color: #ECEEF3; background: #11131A; transform: translateX(-104px); border-radius: 16px">
        <div style="width: 40px; height: 40px; flex: none; border-radius: 13px; background: #F5B57A; color: #0A0B10; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">AK</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; gap: 8px"><span style="flex: 1; font-weight: 600">Anna Kowalska</span><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: {{accent}}">10:42</span></div>
          <span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Gauge report and updated shelter agreement</span>
        </div>
      </a>
    </div>
    <sc-for list="{{rows}}" as="m" hint-placeholder-count="5">
      <a href="MobileThread.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 16px; text-decoration: none; color: #ECEEF3">
        <div style="width: 40px; height: 40px; flex: none; border-radius: 13px; background: {{m.bg}}; color: #0A0B10; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">{{m.initials}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; gap: 8px"><span style="{{m.fromStyle}}">{{m.from}}</span><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8">{{m.time}}</span></div>
          <span style="{{m.subjStyle}}">{{m.subject}}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <a href="#" aria-label="New message" style="position: absolute; right: 16px; bottom: 100px; width: 60px; height: 60px; border-radius: 20px; background: {{accent}}; color: #0A0B10; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(142,162,255,.35)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </a>

  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 16px; height: 64px; border-radius: 22px; background: rgba(23,26,35,.92); border: 1px solid #2A2E3A; backdrop-filter: blur(16px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v7H2v-7Z"/></svg>Mail</a>
    <a href="MobileChats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Chat</a>
    <a href="MobileCalendar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
    <a href="MobileDrive.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3Z"/></svg>Files</a>
    
    <a href="MobileMore.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { from: 'River Authority alerts', initials: 'PA', bg: '#9198A8', subject: 'Gauge at the bridge passed 4.2 m', snippet: 'Rising 12 cm per hour', time: '11:08', unread: true },
      { from: 'Marek, Ana', initials: 'MA', bg: '#A9B6FF', subject: 'Shelter capacity sheet', snippet: 'Please fill in your district by 10:00', time: '09:15', unread: true },
      { from: 'Daniel Price', initials: 'DP', bg: '#6FE0D5', subject: 'Invitation: hydrology briefing', snippet: 'Thu 16:00 · 45 min', time: '08:30', unread: false },
      { from: 'Jonas Weber', initials: 'JW', bg: '#9198A8', subject: 'Police escort schedule', snippet: 'Two units can cover R-12 until 18:00', time: '08:57', unread: false },
      { from: 'Ana Ferreira', initials: 'AF', bg: '#C6F06B', subject: 'Town hall tonight: talking points', snippet: 'Please check the shelter numbers', time: 'Tue', unread: false }
    ];
    const rows = raw.map((m) => ({
      ...m,
      fromStyle: 'flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: ' + (m.unread ? '600' : '400') + '; color: ' + (m.unread ? '#ECEEF3' : '#C3C8D4'),
      subjStyle: 'font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (m.unread ? '#ECEEF3' : '#C3C8D4')
    }));
    return { accent: this.props.accent ?? '#8EA2FF', rows };
  }
}
</script>
</body>
</html>
