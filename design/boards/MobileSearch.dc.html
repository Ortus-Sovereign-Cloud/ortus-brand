<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*//*dense2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
mark{background:rgba(142,162,255,.28);color:#FFFFFF;border-radius:3px;padding:0 2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <div style="padding: 14px 16px 10px; display: flex; align-items: center; gap: 8px">
    <div style="flex: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 16px; background: #13151C; border: 2px solid {{accent}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="q" style="position: absolute; left: -9999px">Search</label>
      <input id="q" value="gauge" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #ECEEF3; font: 500 16px Geist, sans-serif">
    </div>
    <a href="MobileInbox.dc.html" style="height: 44px; padding: 0 6px; display: flex; align-items: center; text-decoration: none; color: #C3C8D4">Cancel</a>
  </div>
  <div style="display: flex; gap: 6px; padding: 0 16px 12px; overflow: hidden">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button style="{{c.style}}">{{c.label}}</button></sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8; padding: 6px 4px">Top hit</div>
    <a href="MobileThread.dc.html" style="display: flex; gap: 12px; padding: 12px; border-radius: 16px; background: #13151C; border: 1px solid #262A35; text-decoration: none; color: #ECEEF3">
      <div style="width: 40px; height: 40px; flex: none; border-radius: 13px; background: #F5B57A; color: #0A0B10; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">AK</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <div style="display: flex"><span style="flex: 1; font-weight: 600">Anna Kowalska</span><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8">10:42</span></div>
        <span style="font-size: 14px"><mark>Gauge</mark> report and updated shelter agreement</span>
      </div>
    </a>

    <div style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8; padding: 14px 4px 6px">Files</div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{files}}" as="f" hint-placeholder-count="3">
        <a href="#" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; background: #13151C; border: 1px solid #262A35; text-decoration: none; color: #ECEEF3">
          <span style="font: 600 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #FF9A92">PDF</span>
          <span style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span>
          <span style="font-size: 13px; color: #9198A8">{{f.meta}}</span>
        </a>
      </sc-for>
    </div>

    <div style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8; padding: 14px 4px 6px">Messages · 6 more</div>
    <sc-for list="{{more}}" as="m" hint-placeholder-count="3">
      <a href="#" style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; text-decoration: none; color: #ECEEF3">
        <div style="display: flex"><span style="flex: 1; font-weight: 500">{{m.from}}</span><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8">{{m.when}}</span></div>
        <span style="font-size: 14px; color: #C3C8D4">{{m.subject}}</span>
      </a>
    </sc-for>

    <div style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8; padding: 14px 4px 6px">Recent</div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="height: 32px; padding: 0 12px; border-radius: 10px; background: #13151C; color: #C3C8D4; font: 500 13px 'Geist Mono', monospace; display: flex; align-items: center">from:daniel</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 10px; background: #13151C; color: #C3C8D4; font: 500 13px 'Geist Mono', monospace; display: flex; align-items: center">larger:10M</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 10px; background: #13151C; color: #C3C8D4; font: 500 13px 'Geist Mono', monospace; display: flex; align-items: center">dmarc report</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = 'height: 36px; padding: 0 12px; border-radius: 12px; border: 0; background: #ECEEF3; color: #0A0B10; font: 600 13px Geist, sans-serif; white-space: nowrap';
    const off = 'height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid #262A35; background: transparent; color: #C3C8D4; font: 500 13px Geist, sans-serif; white-space: nowrap';
    return {
      accent: this.props.accent ?? '#8EA2FF',
      chips: [['All', true], ['Attachments', false], ['From me', false], ['Unread', false], ['Events', false]].map(([label, a]) => ({ label, style: a ? on : off })),
      files: [{ name: 'gauge-report.pdf', meta: 'today' }, { name: 'gauge-report-17-Nov.pdf', meta: 'Tue' }, { name: 'gauge-report-16-Nov.pdf', meta: 'Mon' }],
      more: [
        { from: 'Anna Kowalska', when: 'Tue', subject: 'Gauge report 17 Nov' },
        { from: 'River Authority', when: 'Sun', subject: 'Daily gauge summary' },
        { from: 'Anna Kowalska', when: 'Mon', subject: 'Corrected gauge report (sensor 2)' }
      ]
    };
  }
}
</script>
</body>
</html>
