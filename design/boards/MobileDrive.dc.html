<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile drive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*//*dense2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <h1 style="margin: 0; flex: 1; font-size: 30px; font-weight: 600; letter-spacing: -.03em">Files</h1>
      <a href="MobileSearch.dc.html" aria-label="Search files" style="width: 44px; height: 44px; border-radius: 14px; background: #13151C; border: 1px solid #262A35; color: #ECEEF3; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 72px; border-radius: 16px; border: 1px solid #262A35; background: #13151C; color: #ECEEF3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px Geist, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>Scan</button>
      <button style="height: 72px; border-radius: 16px; border: 1px solid #262A35; background: #13151C; color: #ECEEF3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px Geist, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>Upload</button>
      <button style="height: 72px; border-radius: 16px; border: 1px solid #262A35; background: #13151C; color: #ECEEF3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px Geist, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3Z"/><path d="M12 11v5M9.5 13.5h5"/></svg>Folder</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(79,209,197,.08); border: 1px solid rgba(79,209,197,.25)">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #4FD1C5"></span>
      <span style="flex: 1; font-size: 13px; color: #C3C8D4">Photo backup on · 14 new photos uploading</span>
      <span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #6FE0D5">Wi-Fi</span>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center"><span style="flex: 1; font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8">Recent</span><a href="#" style="font-size: 13px; text-decoration: none">See all</a></div>
    <div style="display: flex; gap: 10px">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
        <a href="MobileShare.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #ECEEF3">
          <span style="{{r.thumb}}">{{r.ext}}</span>
          <span style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
        </a>
      </sc-for>
    </div>
    <div style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8; padding-top: 6px">My Drive</div>
    <sc-for list="{{items}}" as="f" hint-placeholder-count="5">
      <a href="MobileShare.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 0; text-decoration: none; color: #ECEEF3">
        <span style="{{f.icon}}">{{f.ext}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span><span style="font-size: 13px; color: #9198A8">{{f.meta}}</span></span>
        <sc-if value="{{f.offline}}" hint-placeholder-val="{{ false }}"><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #6FE0D5">Offline</span></sc-if>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 16px; height: 64px; border-radius: 22px; background: rgba(23,26,35,.92); border: 1px solid #2A2E3A; backdrop-filter: blur(16px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="MobileInbox.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v7H2v-7Z"/></svg>Mail</a>
    <a href="MobileChats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Chat</a>
    <a href="MobileCalendar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3Z"/></svg>Files</a>
    
    <a href="MobileMore.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const E = {
      PDF: ['rgba(255,120,110,.15)', '#FF9A92'], DOC: ['rgba(142,162,255,.15)', '#A9B6FF'], XLS: ['rgba(79,209,197,.15)', '#6FE0D5'],
      DIR: ['#1E2230', '#C3C8D4'], IMG: ['rgba(198,240,107,.14)', '#D4F28F']
    };
    const recent = [['DOC', 'shelter-agreement.docx'], ['PDF', 'gauge-report.pdf'], ['IMG', 'rack-layout.png']].map(([ext, name]) => ({
      ext, name, thumb: 'height: 92px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font: 600 13px Geist, sans-serif; font-variant-numeric: tabular-nums; background: ' + E[ext][0] + '; color: ' + E[ext][1]
    }));
    const items = [
      ['DIR', 'Emergency', '12 items · shared with team'],
      ['DIR', 'From email', 'Attachments, saved automatically'],
      ['DIR', 'Photos', '2,418 items · backup'],
      ['XLS', 'shelter-capacity.xlsx', 'You · yesterday', true],
      ['PDF', 'passport-scan.pdf', 'Scanned · Nov 9', true]
    ].map(([ext, name, meta, offline]) => ({
      ext, name, meta, offline: !!offline,
      icon: 'width: 40px; height: 40px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; font: 600 13px Geist, sans-serif; font-variant-numeric: tabular-nums; background: ' + E[ext][0] + '; color: ' + E[ext][1]
    }));
    return { accent: this.props.accent ?? '#8EA2FF', recent, items };
  }
}
</script>
</body>
</html>
