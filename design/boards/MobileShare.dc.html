<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile share sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*//*dense2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07080C; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px">
  <header style="display: flex; align-items: center; gap: 6px; padding: 12px 8px; opacity: .45">
    <a href="MobileDrive.dc.html" aria-label="Back to files" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEEF3"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span style="flex: 1; font-weight: 600">shelter-agreement.docx</span>
  </header>
  <div style="margin: 8px 24px; height: 340px; border-radius: 8px; background: #FBFBF9; opacity: .45; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <span style="width: 60%; height: 12px; border-radius: 3px; background: #1B1D22"></span>
    <span style="width: 95%; height: 6px; border-radius: 3px; background: #B9BDC7"></span>
    <span style="width: 88%; height: 6px; border-radius: 3px; background: #B9BDC7"></span>
    <span style="width: 92%; height: 6px; border-radius: 3px; background: #B9BDC7"></span>
    <span style="width: 40%; height: 9px; border-radius: 3px; background: #1B1D22; margin-top: 10px"></span>
    <span style="width: 90%; height: 6px; border-radius: 3px; background: #B9BDC7"></span>
  </div>

  <div role="dialog" aria-labelledby="sh" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 24px; border-radius: 26px 26px 0 0; background: #13151C; border-top: 1px solid #2A2E3A; box-shadow: 0 -20px 50px rgba(0,0,0,.55); display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #333846"></span>
    <h2 id="sh" style="margin: 0; font-size: 18px; font-weight: 600">Share</h2>
    <div style="display: flex; gap: 14px">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
        <button style="width: 64px; border: 0; background: transparent; color: #ECEEF3; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; font: 13px Geist, sans-serif">
          <span style="width: 52px; height: 52px; border-radius: 17px; background: {{p.bg}}; color: #0A0B10; display: flex; align-items: center; justify-content: center; font-weight: 600">{{p.i}}</span>{{p.name}}
        </button>
      </sc-for>
    </div>
    <div style="padding: 16px; border-radius: 16px; background: #0A0B10; border: 1px solid #262A35; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; font-weight: 600">Link</span><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #F5B57A">View only · 30 days</span></div>
      <span style="font: 500 13px 'Geist Mono', monospace; color: {{accent}}">drive.ministry.example/s/k7Qm2…</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 44px; border-radius: 12px; border: 0; background: {{accent}}; color: #0A0B10; font: 600 14px Geist, sans-serif">Copy link</button>
        <button style="height: 44px; border-radius: 12px; border: 1px solid #333846; background: transparent; color: #ECEEF3; font: 500 14px Geist, sans-serif">Link settings</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
        <button style="display: flex; align-items: center; gap: 12px; height: 48px; border: 0; border-bottom: 1px solid #1E2129; background: transparent; color: #ECEEF3; font: 15px Geist, sans-serif; text-align: left; padding: 0">
          <span style="flex: 1">{{a.label}}</span><span style="font-size: 13px; color: #9198A8">{{a.hint}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#8EA2FF',
      people: [
        { i: 'AK', bg: '#F5B57A', name: 'Anna' },
        { i: 'DP', bg: '#6FE0D5', name: 'Daniel' },
        { i: 'MA', bg: '#A9B6FF', name: 'Team' },
        { i: '+', bg: '#333846', name: 'More' }
      ],
      actions: [
        { label: 'Send as email attachment', hint: 'or as link if > 25 MB' },
        { label: 'Make available offline', hint: '48 KB' },
        { label: 'Version history', hint: 'v4 · 4 saved' },
        { label: 'Open in another app', hint: '' }
      ]
    };
  }
}
</script>
</body>
</html>
