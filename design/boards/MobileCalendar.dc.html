<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*//*dense2*/
body{margin:0}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column"><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8">November 2026</span><h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.03em">Wednesday</h1></div>
      <button aria-label="Month view" style="width: 44px; height: 44px; border-radius: 14px; background: #13151C; border: 1px solid #262A35; color: #ECEEF3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <button style="{{d.style}}"><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; opacity: .75">{{d.dow}}</span><span style="font-size: 17px; font-weight: 600">{{d.n}}</span><span style="{{d.dot}}"></span></button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 6px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{items}}" as="e" hint-placeholder-count="5">
      <div style="display: flex; gap: 12px">
        <div style="width: 46px; padding-top: 14px; display: flex; flex-direction: column; font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #9198A8">{{e.start}}<span style="color: #8A91A1">{{e.end}}</span></div>
        <div style="{{e.card}}">
          <span style="font-weight: 600">{{e.title}}</span>
          <span style="font-size: 13px; color: #9198A8">{{e.meta}}</span>
          <sc-if value="{{e.join}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; gap: 6px; padding-top: 6px"><span style="height: 36px; padding: 0 14px; border-radius: 10px; background: {{accent}}; color: #0A0B10; display: flex; align-items: center; font-weight: 600; font-size: 13px">Join video</span><span style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #333846; display: flex; align-items: center; font-size: 13px">Email guest</span></div>
          </sc-if>
        </div>
      </div>
      <sc-if value="{{e.nowAfter}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 8px; padding-left: 52px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FF7A6E"></span><span style="flex: 1; height: 2px; background: #FF7A6E"></span><span style="font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: #FF9A92">11:08</span></div>
      </sc-if>
    </sc-for>
  </div>

  <a href="#" aria-label="New event" style="position: absolute; right: 16px; bottom: 100px; width: 60px; height: 60px; border-radius: 20px; background: {{accent}}; color: #0A0B10; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(142,162,255,.35)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>

  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 16px; height: 64px; border-radius: 22px; background: rgba(23,26,35,.92); border: 1px solid #2A2E3A; backdrop-filter: blur(16px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="MobileInbox.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v7H2v-7Z"/></svg>Mail</a>
    <a href="MobileChats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Chat</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
    <a href="MobileDrive.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3Z"/></svg>Files</a>
    
    <a href="MobileMore.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9198A8; font-size: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8EA2FF';
    const week = [['Mon', 16, 3], ['Tue', 17, 3], ['Wed', 18, 3], ['Thu', 19, 4], ['Fri', 20, 2], ['Sat', 21, 0], ['Sun', 22, 0]].map(([dow, n, c]) => {
      const sel = n === 18;
      return {
        dow, n: String(n),
        style: 'height: 64px; border-radius: 14px; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: Geist, sans-serif; ' + (sel ? 'background: ' + accent + '; color: #0A0B10' : 'background: #13151C; color: #ECEEF3'),
        dot: 'width: 4px; height: 4px; border-radius: 50%; background: ' + (c ? (sel ? '#0A0B10' : accent) : 'transparent')
      };
    });
    const K = {
      MEETING: ['rgba(142,162,255,.14)', accent, '#A9B6FF'],
      BOOKING: ['rgba(79,209,197,.14)', '#4FD1C5', '#6FE0D5'],
      FOCUS: ['#13151C', '#8A91A1', '#9198A8'],
      REMINDER: ['#13151C', '#F5A35C', '#F5B57A']
    };
    const items = [
      { start: '09:30', end: '09:45', kind: 'MEETING', title: 'Standup', meta: 'Team · 6 people' },
      { start: '11:30', end: '12:00', kind: 'BOOKING', title: 'Call: River Authority', meta: 'Daniel Price · booked through your link', join: true, before: true },
      { start: '15:00', end: '16:00', kind: 'FOCUS', title: 'Bus plan', meta: 'Shown as busy' },
      { start: '17:30', end: '', kind: 'REMINDER', title: 'Reply to Daniel', meta: 'From email · snoozed thread' }
    ].map((e) => {
      const [bg, bar, fg] = K[e.kind];
      return {
        ...e, join: !!e.join, nowAfter: e.start === '09:30',
        card: 'flex: 1; padding: 14px 16px; border-radius: 16px; background: ' + bg + '; box-shadow: inset 3px 0 0 ' + bar + '; display: flex; flex-direction: column; gap: 4px',
        kindStyle: 'font: 500 13px Geist, sans-serif; font-variant-numeric: tabular-nums; color: ' + fg
      };
    });
    return { accent, week, items };
  }
}
</script>
</body>
</html>
