<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover spaces</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*type2*/
body{margin:0;background:#0A0B10;color:#ECEEF3;font-family:Geist,system-ui,sans-serif}
a{color:#A9B6FF}a:hover{color:#C9D1FF}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #07080C">
<nav aria-label="Apps" style="flex: 0 0 68px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; background: #07080C; border-right: 1px solid #1E2129; box-sizing: border-box">
<a href="Main.dc.html" aria-label="Ortus home" style="width: 34px; height: 34px; margin-bottom: 10px; border-radius: 10px; background: {{accent}}; color: #0A0B10; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><g fill="currentColor"><path d="M22 30 L4 30 A18 18 0 0 1 22 12 Z"/><path d="M26 30 L26 12 A18 18 0 0 1 44 30 Z"/><rect x="4" y="34" width="40" height="5" rx="2.5"/></g></svg></a>
<a href="Main.dc.html" aria-label="Mail" style="position: relative; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 12px; text-decoration: none; font-size: 11px; color: #9198A8"><span aria-hidden="true" style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: linear-gradient(155deg, #1B2350, #0B0D14); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 48 48"><rect x="5" y="11" width="38" height="27" rx="6" fill="#8EA2FF"/><path d="M9 16 L24 27 L39 16" fill="none" stroke="#ECEEF3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Mail</a>
<a href="WebChat.dc.html" aria-label="Chat" style="position: relative; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 12px; text-decoration: none; font-size: 11px; color: #9198A8"><span aria-hidden="true" style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: linear-gradient(155deg, #1B2350, #0B0D14); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 48 48"><circle cx="25" cy="22" r="16" fill="#8EA2FF"/><path d="M12 31 L7 42 L20 36 Z" fill="#8EA2FF"/><circle cx="18" cy="22" r="2.4" fill="#ECEEF3"/><circle cx="25" cy="22" r="2.4" fill="#ECEEF3"/><circle cx="32" cy="22" r="2.4" fill="#ECEEF3"/></svg></span>Chat<span style="position: absolute; right: 8px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: {{accent}}"></span></a>
<a href="WebCalendar.dc.html" aria-label="Calendar" style="position: relative; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 12px; text-decoration: none; font-size: 11px; color: #9198A8"><span aria-hidden="true" style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: linear-gradient(155deg, #0E2F2E, #0B0D14); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 48 48"><rect x="6" y="8" width="36" height="34" rx="7" fill="#4FD1C5"/><path d="M6 15 A7 7 0 0 1 13 8 H35 A7 7 0 0 1 42 15 V18 H6 Z" fill="#ECEEF3"/><rect x="27" y="27" width="8" height="8" rx="2" fill="#0B0D14"/></svg></span>Calendar</a>
<a href="WebDrive.dc.html" aria-label="Drive" style="position: relative; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 12px; text-decoration: none; font-size: 11px; color: #9198A8"><span aria-hidden="true" style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: linear-gradient(155deg, #3A2412, #0B0D14); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 48 48"><path d="M24 7 L43 17 L24 27 L5 17 Z" fill="#ECEEF3"/><path d="M5 25 L24 35 L43 25" fill="none" stroke="#F5A35C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 32 L24 42 L43 32" fill="none" stroke="#F5A35C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/></svg></span>Drive</a>
<a href="WebDocEditor.dc.html" aria-label="Docs" style="position: relative; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 12px; text-decoration: none; font-size: 11px; color: #9198A8"><span aria-hidden="true" style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: linear-gradient(155deg, #3A2412, #0B0D14); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 48 48"><path d="M10 9 A4 4 0 0 1 14 5 H28 L38 15 V39 A4 4 0 0 1 34 43 H14 A4 4 0 0 1 10 39 Z" fill="#F5A35C"/><path d="M28 5 V15 H38 Z" fill="#ECEEF3" opacity=".7"/><rect x="16" y="22" width="16" height="3.5" rx="1.75" fill="#ECEEF3"/><rect x="16" y="29" width="16" height="3.5" rx="1.75" fill="#ECEEF3"/><rect x="16" y="36" width="9" height="3.5" rx="1.75" fill="#ECEEF3"/></svg></span>Docs</a>
<a href="WebTasks.dc.html" aria-label="Tasks" style="position: relative; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 12px; text-decoration: none; font-size: 11px; color: #9198A8"><span aria-hidden="true" style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: linear-gradient(155deg, #0E2F2E, #0B0D14); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 48 48"><path d="M6 24 A18 18 0 0 1 24 6 H42 V24 A18 18 0 0 1 24 42 H6 Z" fill="#4FD1C5"/><path d="M15 24 L21.5 30.5 L33 19" fill="none" stroke="#ECEEF3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Tasks</a>
<span style="width: 28px; height: 1px; margin: 4px 0; background: #262A35"></span>
<a href="WebSpace.dc.html" aria-label="Spaces" aria-current="page" style="position: relative; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 12px; text-decoration: none; font-size: 11px; background: #1E2230; color: {{accent}}; font-weight: 600"><span aria-hidden="true" style="width: 30px; height: 30px; flex: none; border-radius: 9px; background: linear-gradient(155deg, #1B2350, #0B0D14); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 48 48"><path d="M10 26 A14 14 0 0 1 24 40" fill="none" stroke="#8EA2FF" stroke-width="4.5" stroke-linecap="round"/><path d="M10 14 A26 26 0 0 1 36 40" fill="none" stroke="#8EA2FF" stroke-width="4.5" stroke-linecap="round" opacity=".55"/><circle cx="12" cy="38" r="4.5" fill="#ECEEF3"/></svg></span>Spaces</a>
<a href="AppSwitcher.dc.html" aria-label="All apps" style="width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 12px; text-decoration: none; font-size: 11px; color: #9198A8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>All apps</a>
<span style="flex: 1"></span>
<a href="WebNotifications.dc.html" aria-label="Notifications, 9 unread" style="position: relative; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #9198A8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg><span style="position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #FF7A6E"></span></a>
<a href="WebPersonal.dc.html" aria-label="My settings" style="width: 36px; height: 36px; margin-top: 6px; border-radius: 12px; background: #DDE3F8; color: #0A0B10; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; ">OH</a>
</nav>
<div style="flex: 999 1 560px; min-width: 0">
<div style="min-height: 900px; background: #0A0B10; color: #ECEEF3; font-family: Geist, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #1E2129">
    <a href="WebSpace.dc.html" aria-label="Back to spaces" style="width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #ECEEF3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span style="font-weight: 600">Discover</span>
    <span style="flex: 1"></span>
    <button style="height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid #333846; background: transparent; color: #ECEEF3; font: 500 14px Geist, sans-serif">Join with invite link</button>
    <button style="height: 38px; padding: 0 14px; border-radius: 12px; border: 0; background: {{accent}}; color: #0A0B10; font: 600 14px Geist, sans-serif">Create a space</button>
  </header>

  <main style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 28px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.03em">Find a space to join</h1>
      <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-radius: 14px; background: #13151C; border: 1px solid #333846; max-width: 640px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9198A8" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="ds" style="position: absolute; left: -9999px">Search spaces</label>
        <input id="ds" placeholder="Search spaces, topics or organisations" style="flex: 1; border: 0; outline: none; background: transparent; color: #ECEEF3; font: 15px Geist, sans-serif">
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><button style="{{c.style}}">{{c.label}}</button></sc-for>
      </div>
    </div>

    <section aria-labelledby="live-h" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="live-h" style="margin: 0; font: 500 12px 'Geist Mono', monospace; color: #9198A8; letter-spacing: .06em">LIVE NOW</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px">
        <sc-for list="{{live}}" as="l" hint-placeholder-count="3">
          <a href="WebSpace.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #11131A; border: 1px solid #262A35; text-decoration: none; color: #ECEEF3">
            <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(79,209,197,.14); color: #6FE0D5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7"/></svg></span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{l.room}}</span><span style="font-size: 13px; color: #9198A8">{{l.space}} · {{l.n}} listening</span></span>
            <span style="height: 32px; padding: 0 12px; border-radius: 10px; background: #1E2230; display: flex; align-items: center; font-size: 14px; font-weight: 600">Drop in</span>
          </a>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="sp-h" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="sp-h" style="margin: 0; font: 500 12px 'Geist Mono', monospace; color: #9198A8; letter-spacing: .06em">SPACES</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
        <sc-for list="{{spaces}}" as="s" hint-placeholder-count="6">
          <div style="border-radius: 18px; background: #11131A; border: 1px solid #1E2129; overflow: hidden; display: flex; flex-direction: column">
            <div style="{{s.banner}}"></div>
            <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px">
              <span style="{{s.icon}}">{{s.i}}</span>
              <span style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 600; font-size: 16px">{{s.name}}</span><sc-if value="{{s.verified}}" hint-placeholder-val="{{ false }}"><span style="font: 500 11px 'Geist Mono', monospace; padding: 2px 6px; border-radius: 5px; background: rgba(142,162,255,.15); color: #A9B6FF">VERIFIED ORG</span></sc-if></span>
              <span style="font-size: 14px; color: #9198A8; line-height: 1.5">{{s.desc}}</span>
              <div style="display: flex; align-items: center; gap: 10px; padding-top: 4px">
                <span style="flex: 1; font: 500 12px 'Geist Mono', monospace; color: #9198A8">{{s.meta}}</span>
                <button style="{{s.btn}}">{{s.cta}}</button>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8EA2FF","options":["#8EA2FF","#4FD1C5","#C6F06B","#F5A35C"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8EA2FF';
    const cats = ['All', 'Public services', 'Technology', 'Education', 'Local community', 'Open data'].map((label, i) => ({
      label, style: 'height: 34px; padding: 0 14px; border-radius: 12px; font: 500 14px Geist, sans-serif; ' + (i === 0 ? 'border: 0; background: #ECEEF3; color: #0A0B10' : 'border: 1px solid #262A35; background: transparent; color: #C3C8D4')
    }));
    const live = [
      { room: 'Sandbag crew briefing', space: 'Volunteer Hub', n: 7 },
      { room: 'Ask about damage claims', space: 'Citizen Help Desk', n: 23 },
      { room: 'Town hall: flood response', space: 'City of [Name]', n: 412 }
    ];
    const raw = [
      ['OS', '#A9B6FF', 'Volunteer Hub', 'Volunteers helping with the flood: crews, shifts, briefings and questions.', '2,340 MEMBERS · 186 ONLINE', 'Open', true, false],
      ['CH', '#6FE0D5', 'Citizen Help Desk', 'Talk to public service advisors in text or voice. No account needed for guests.', '18k MEMBERS · 9 ADVISORS ON', 'Join', false, true],
      ['CB', '#F5B57A', 'City of [Name]', 'Announcements, town halls and neighbourhood channels.', '41k MEMBERS', 'Join', false, true],
      ['TA', '#C6F06B', 'Training Academy', 'Courses for civil servants. Live classes with a stage and Q&A.', 'INVITE ONLY · ORG MEMBERS', 'Request to join', false, true],
      ['OD', '#A9B6FF', 'Open Data Circle', 'Share datasets, ask questions, show what you built.', '3,120 MEMBERS', 'Join', false, false],
      ['LM', '#F5B57A', 'Local Makers', 'Repair cafés, workshops and a shared tool library.', '860 MEMBERS', 'Join', false, false]
    ];
    const spaces = raw.map(([i, c, name, desc, meta, cta, joined, verified]) => ({
      i, name, desc, meta, cta, verified,
      banner: 'height: 64px; background: linear-gradient(120deg, ' + c + '33, transparent 70%)',
      icon: 'margin-top: -24px; width: 48px; height: 48px; border-radius: 16px; background: ' + c + '; color: #0A0B10; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 4px solid #11131A',
      btn: 'height: 34px; padding: 0 14px; border-radius: 10px; font: 600 14px Geist, sans-serif; ' + (joined ? 'border: 1px solid #333846; background: transparent; color: #ECEEF3' : 'border: 0; background: ' + accent + '; color: #0A0B10')
    }));
    return { accent, cats, live, spaces };
  }
}
</script>
</body>
</html>
